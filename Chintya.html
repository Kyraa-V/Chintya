<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata — Chintya Maulida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-ocean:#073B57;
    --teal:#146C94;
    --pink:#FF8FAB;
    --blush:#FFD9E4;
    --cream:#FFF7FA;
    --gold:#F4C95D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(160deg,var(--deep-ocean) 0%, var(--teal) 45%, var(--pink) 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding:24px;
  }

  /* ambient bubbles rising from the sea */
  .bubble{
    position:fixed;
    bottom:-60px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), rgba(255,255,255,0.05));
    opacity:0.55;
    animation:rise linear infinite;
    pointer-events:none;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0) scale(1); opacity:0; }
    10%{ opacity:0.6; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) scale(1.1); opacity:0; }
  }

  /* card */
  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, var(--cream) 0%, #FFECF3 100%);
    border-radius:28px;
    padding:38px 30px 32px;
    box-shadow:0 30px 60px rgba(3,30,48,0.45), 0 0 0 1px rgba(255,255,255,0.4) inset;
    overflow:hidden;
    animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(40px) scale(.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* wave decoration at top of the card */
  .wave-cap{
    position:absolute; top:0; left:0; width:100%; height:90px;
    background:
      radial-gradient(120% 100% at 20% 0%, var(--teal) 0%, transparent 60%),
      linear-gradient(120deg, var(--deep-ocean), var(--teal));
    clip-path: path('M0,40 C 80,90 160,0 240,35 C 320,70 360,10 420,40 L420,0 L0,0 Z');
    opacity:0.9;
  }

  .badge{
    position:relative;
    z-index:3;
    width:78px; height:78px;
    margin:6px auto 6px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6d8, var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-size:34px;
    box-shadow:0 8px 20px rgba(244,201,93,0.55), 0 0 0 6px rgba(255,255,255,0.6);
    animation:pulseBadge 2.6s ease-in-out infinite;
  }
  @keyframes pulseBadge{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.07); }
  }

  h1{
    position:relative; z-index:3;
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:30px;
    text-align:center;
    color:var(--deep-ocean);
    margin-top:8px;
    letter-spacing:0.3px;
  }
  .subtitle{
    text-align:center;
    font-size:12.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--pink);
    font-weight:600;
    margin-top:4px;
    margin-bottom:22px;
  }

  .fields{
    display:flex;
    flex-direction:column;
    gap:12px;
    position:relative; z-index:3;
  }
  .field{
    display:grid;
    grid-template-columns:38px 1fr;
    align-items:center;
    gap:14px;
    background:rgba(255,255,255,0.65);
    border:1px solid rgba(20,108,148,0.15);
    border-radius:16px;
    padding:12px 14px;
    opacity:0;
    transform:translateX(-16px);
    animation:slideIn 0.6s ease forwards;
  }
  .field:nth-child(1){ animation-delay:.15s; }
  .field:nth-child(2){ animation-delay:.30s; }
  .field:nth-child(3){ animation-delay:.45s; }
  .field:nth-child(4){ animation-delay:.60s; }
  @keyframes slideIn{
    to{ opacity:1; transform:translateX(0); }
  }
  .icon{
    width:38px; height:38px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--teal), var(--deep-ocean));
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
  }
  .label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--teal);
    font-weight:600;
  }
  .value{
    font-size:15px;
    color:var(--deep-ocean);
    font-weight:500;
    margin-top:1px;
  }

  .motto{
    position:relative; z-index:3;
    margin-top:22px;
    padding:18px 18px;
    border-radius:16px;
    background:linear-gradient(120deg, var(--pink), #ffb6c9);
    color:#fff;
    text-align:center;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:14.5px;
    line-height:1.55;
    box-shadow:0 12px 24px rgba(255,143,171,0.4);
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:.8s;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .motto::before{
    content:"“";
    font-size:26px;
    display:block;
    line-height:0.4;
    margin-bottom:8px;
    opacity:.85;
  }

  /* music control */
  .music-bar{
    margin-top:20px;
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(7,59,87,0.06);
    border-radius:999px;
    padding:8px 14px;
    position:relative; z-index:3;
  }
  #playBtn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--deep-ocean), var(--teal));
    color:#fff;
    font-size:14px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex:none;
    transition:transform .2s ease;
  }
  #playBtn:active{ transform:scale(0.9); }
  .track-info{ flex:1; min-width:0; }
  .track-title{ font-size:12.5px; font-weight:600; color:var(--deep-ocean); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-artist{ font-size:11px; color:var(--teal); }
  .eq{ display:flex; gap:2px; align-items:flex-end; height:16px; flex:none; }
  .eq span{ width:3px; background:var(--pink); border-radius:2px; animation:eq 0.9s ease-in-out infinite; }
  .eq span:nth-child(1){ height:6px; animation-delay:0s; }
  .eq span:nth-child(2){ height:14px; animation-delay:.15s; }
  .eq span:nth-child(3){ height:9px; animation-delay:.3s; }
  .eq.paused span{ animation-play-state:paused; height:4px !important; }
  @keyframes eq{
    0%,100%{ transform:scaleY(0.4); }
    50%{ transform:scaleY(1); }
  }

  .note{
    margin-top:10px;
    font-size:10px;
    color:var(--teal);
    text-align:center;
    opacity:0.75;
    position:relative; z-index:3;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
  }
</style>
</head>
<body>

<audio id="bgm" loop preload="none">
  <source src="1000x.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <div class="wave-cap"></div>
  <div class="badge">🚓</div>
  <h1>Chintya Maulida</h1>
  <div class="subtitle">Biodata Diri</div>

  <div class="fields">
    <div class="field">
      <div class="icon">🎂</div>
      <div>
        <div class="label">Umur</div>
        <div class="value">Gaada yang tahu 😄</div>
      </div>
    </div>
    <div class="field">
      <div class="icon">⭐</div>
      <div>
        <div class="label">Cita-cita</div>
        <div class="value">Polwan</div>
      </div>
    </div>
    <div class="field">
      <div class="icon">🛍️</div>
      <div>
        <div class="label">Hobi</div>
        <div class="value">Jajan</div>
      </div>
    </div>
    <div class="field">
      <div class="icon">🌊</div>
      <div>
        <div class="label">Motto Hidup</div>
        <div class="value">Selalu optimis &amp; percaya diri</div>
      </div>
    </div>
  </div>

  <div class="motto">
    Kemanapun kita melangkah,<br>pasti akan ada jalan.
  </div>

  <div class="music-bar">
    <button id="playBtn" aria-label="Putar musik">▶</button>
    <div class="track-info">
      <div class="track-title">1000x</div>
      <div class="track-artist">Ghea Indrawari</div>
    </div>
    <div class="eq paused" id="eq"><span></span><span></span><span></span></div>
  </div>
  <div class="note">Tap ▶ untuk memutar lagu (tambahkan file mp3 sendiri, lihat catatan di chat)</div>
</div>

<script>
  // ambient bubbles
  const body = document.body;
  const bubbleCount = 22;
  for(let i=0;i<bubbleCount;i++){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 6 + Math.random()*22;
    b.style.width = size+'px';
    b.style.height = size+'px';
    b.style.left = Math.random()*100+'vw';
    b.style.setProperty('--drift', (Math.random()*80-40)+'px');
    b.style.animationDuration = (7 + Math.random()*9)+'s';
    b.style.animationDelay = (Math.random()*10)+'s';
    body.appendChild(b);
  }

  const audio = document.getElementById('bgm');
  const playBtn = document.getElementById('playBtn');
  const eq = document.getElementById('eq');

  playBtn.addEventListener('click', () => {
    if(audio.paused){
      audio.play().catch(()=>{
        alert('File lagu belum tersedia. Tambahkan file mp3 "1000x - Ghea Indrawari" pada baris <audio><source> di kode HTML.');
      });
      playBtn.textContent = '❚❚';
      eq.classList.remove('paused');
    } else {
      audio.pause();
      playBtn.textContent = '▶';
      eq.classList.add('paused');
    }
  });
</script>

</body>
</html>
